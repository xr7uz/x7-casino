# Cloud-Build für iOS ohne eigenen Mac (Codemagic).
# Vorher in Codemagic einrichten (siehe ANLEITUNG-OHNE-MAC.md):
#  1. Team integrations > Developer Portal: App-Store-Connect-API-Key mit dem Namen "X7 ASC" anlegen
#  2. Code signing identities: Apple-Distribution-Zertifikat erzeugen + App-Store-Profil abrufen
#  3. APP_STORE_APPLE_ID unten durch die Apple-ID der App ersetzen (Zahl aus App Store Connect)
workflows:
  ios-testflight:
    name: X7 Casino → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: X7 ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: xyz.xr7uz.casino
      vars:
        APP_STORE_APPLE_ID: 0000000000 # PRÜFEN: eigene App-ID eintragen
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Abhängigkeiten installieren
        script: npm install
      - name: Web-App bauen
        script: npm run build
      - name: iOS-Projekt erzeugen und synchronisieren
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: App-Icon und Startbildschirm
        script: npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#10070b' --splashBackgroundColor '#0b0609'
      - name: Info.plist (Name, Hochformat, Verschlüsselung)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName X7 Casino" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string X7 Casino" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
      - name: Nur iPhone (keine iPad-Screenshots nötig)
        script: sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Signierung einrichten
        script: xcode-project use-profiles
      - name: Build-Nummer erhöhen
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App
          agvtool new-version -all $(($LATEST + 1))
          agvtool new-marketing-version 1.0.0
      - name: IPA bauen
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
